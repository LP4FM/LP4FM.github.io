<script>

  // (https://lp4fm.github.io/). Map any /LP4FM.github.io/... path back to the
  // matching canonical path, and send everything else to the home page.

    var m = window.location.pathname.match(/^\/LP4FM\.github\.io(\/.*)$/i);
    window.location.replace(m ? 'https://lp4fm.github.io' + m[1] : 'https://lp4fm.github.io/');
  })();
</script>
